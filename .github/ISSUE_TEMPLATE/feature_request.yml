name: Feature request
description: Suggest an improvement to the plug-in, protocol support, compatibility, or tooling
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or user need should this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or interface you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and protocol impact
      description: Note affected MKS-7 parts, hosts, state compatibility, MIDI messages, and any manual or hardware evidence.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
