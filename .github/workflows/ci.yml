name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test:
    name: Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo audit

  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked --version 0.9.2 --features cli cargo-about
      - run: cargo install --locked --git https://github.com/free-audio/clap-validator.git --rev b2f1d9b79b1d264a5747f46707d72b1aa40a02ef clap-validator
      - run: cargo about generate --locked -o THIRD_PARTY_LICENSES.html about.hbs
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES.html
      - run: cargo run --locked -p xtask --release
      - run: bash scripts/validate-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MKS-7-Controller-macOS-Apple-Silicon
          path: target/clap/MKS-7 Controller.clap
          if-no-files-found: error
