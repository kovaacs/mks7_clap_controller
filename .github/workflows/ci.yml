name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test:
    name: Tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Install dependency auditor
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit dependencies
        run: cargo audit

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install license generator
        run: cargo install --locked --version 0.9.2 --features cli cargo-about
      - name: Install CLAP validator
        run: cargo install --locked --git https://github.com/free-audio/clap-validator.git --rev b2f1d9b79b1d264a5747f46707d72b1aa40a02ef clap-validator
      - name: Generate third-party licenses
        run: cargo about generate --locked -o THIRD_PARTY_LICENSES.html about.hbs
      - name: Check third-party licenses
        run: git diff --exit-code -- THIRD_PARTY_LICENSES.html
      - name: Build Apple Silicon bundle
        run: cargo run --locked -p xtask --release
      - name: Validate bundle
        run: scripts/validate-bundle.sh
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: MKS-7-Controller-macOS-Apple-Silicon
          path: target/clap/MKS-7 Controller.clap
          if-no-files-found: error
          retention-days: 14
