name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Verify tag version
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mks7_clap_controller") | .version')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Install dependency auditor
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Generate third-party licenses
        run: |
          cargo install --locked --version 0.9.2 --features cli cargo-about
          cargo about generate --locked -o THIRD_PARTY_LICENSES.html about.hbs
          git diff --exit-code -- THIRD_PARTY_LICENSES.html
      - name: Install CLAP validator
        run: cargo install --locked --git https://github.com/free-audio/clap-validator.git --rev b2f1d9b79b1d264a5747f46707d72b1aa40a02ef clap-validator
      - name: Build Apple Silicon bundle
        run: cargo run --locked -p xtask --release
      - name: Validate bundle
        run: bash scripts/validate-bundle.sh
      - name: Create release archive
        env:
          ARCHIVE: MKS-7-Controller-${{ github.ref_name }}-macOS-Apple-Silicon.zip
        run: |
          mkdir -p target/release-assets
          ditto --norsrc -c -k target/clap "target/release-assets/$ARCHIVE"
          checksum="$(shasum -a 256 "target/release-assets/$ARCHIVE")"
          printf '%s  %s\n' "${checksum%% *}" "$ARCHIVE" > "target/release-assets/$ARCHIVE.sha256"
          (
            cd target/release-assets
            shasum -a 256 -c "$ARCHIVE.sha256"
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release-assets/* --verify-tag --generate-notes --title "MKS-7 CLAP Controller $GITHUB_REF_NAME"
